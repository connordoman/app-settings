# Configuration for the `tern` CLI. The server applies the same migrations at
# boot from its embedded copy, so this is for manual and CI use.
[database]
host = {{ env "PGHOST" }}
port = {{ env "PGPORT" }}
database = {{ env "PGDATABASE" }}
user = {{ env "PGUSER" }}
password = {{ env "PGPASSWORD" }}
sslmode = {{ if env "PGSSLMODE" }}{{ env "PGSSLMODE" }}{{ else }}prefer{{ end }}
version_table = public.schema_version
