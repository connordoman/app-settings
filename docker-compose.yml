# Local dependencies for development. Ports are shifted off the defaults so
# this stack can run alongside any other Postgres or Redis on the machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: settings
      POSTGRES_PASSWORD: settings
      POSTGRES_DB: settings
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settings -d settings"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
